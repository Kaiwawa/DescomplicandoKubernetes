apiVersion: v1
kind: Pod
metadata:
  labels:
    run: homework
    aula: day2
  name: homework
spec:
  containers:
  - image: alpine
    name: alpine-homework
    volumeMounts:
    - mountPath: /homework
      name: volume-homework
    resources:
      limits:
        cpu: "2"
        memory: "256Mi"
      requests:
        cpu: "0.4"
        memory: "16Mi"
    args:
    - sleep
    - "2000"
  volumes:
    - name: volume-homework
      emptyDir:
        sizeLimit: "2Gi"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
